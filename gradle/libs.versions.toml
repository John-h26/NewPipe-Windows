#
# Versions alignées sur l'upstream TeamNewPipe/NewPipe (branche dev,
# commit acb7dfd658a8478686d0f8a0c389269d0ca8df95 du 23/10/2026).

[versions]
coil = "3.6.3"
coroutines = "1.11.0"
jsoup = "1.23.2"
kotlin = "2.4.21"
# L'upstream utilise 1.11.0-alpha07, compilé contre foundation 1.11 : avec Compose 1.12.2,
# OutlinedTextField plante (AbstractMethodError sur CustomStyle.applyStyle). 1.12.0-alpha03
# cible foundation 1.12.
material3 = "1.12.0-alpha03"
multiplatform = "1.12.2"
okhttp = "5.5.0"
# Figés sur un commit (et non dev-SNAPSHOT) pour des builds reproductibles.
# Même commit que l'upstream NewPipe.
teamnewpipe-nanojson = "e9d656ddb49a412a5a0a5d5ef20ca7ef09549996"
teamnewpipe-newpipe-extractor = "e8f89145a830b4d6cae32412007f24ea8b36c73a"
vlcj = "4.9.0"

[libraries]
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
jetbrains-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "teamnewpipe-newpipe-extractor" }
newpipe-nanojson = { module = "com.github.TeamNewPipe:nanojson", version.ref = "teamnewpipe-nanojson" }
squareup-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }

[plugins]
jetbrains-compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "multiplatform" }
jetbrains-kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
